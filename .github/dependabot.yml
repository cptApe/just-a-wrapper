version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: Update
    groups:
      next-and-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      radix-ui:
        patterns:
          - '@radix-ui/*'
          - radix-ui
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      posthog:
        patterns:
          - posthog-*
          - '@posthog/*'
      drizzle:
        patterns:
          - drizzle-*
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: Update
    groups:
      github-actions:
        patterns:
          - '*'
