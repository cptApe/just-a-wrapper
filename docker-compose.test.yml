# Test-only stack for DB-integration tests (pnpm test:integration).
#
# Why a real Postgres and not PGlite: the provisioning code relies on
# pg_advisory_xact_lock to serialize concurrent first-logins. PGlite is
# single-connection (its multiplexing serializes clients over one backend), so
# it cannot reproduce that race. A real Postgres reached through Neon's wsproxy
# gives the exact production driver path (@neondatabase/serverless over
# WebSocket) with genuine separate backend connections.
#
# Ports are non-default (55432 / 54444) to avoid colliding with a host Postgres.
# Local:  docker compose -f docker-compose.test.yml up -d
#         pnpm test:integration
#         docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: agentcore_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d agentcore_test']
      interval: 1s
      timeout: 5s
      retries: 30

  # Neon WebSocket proxy: bridges the serverless driver's WS protocol to plain
  # Postgres. The driver connects to :54444/v1 (the /v1 path is required).
  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: 'postgres:5432'
      ALLOW_ADDR_REGEX: '.*'
      LOG_TRAFFIC: 'false'
    ports:
      - '54444:80'
    depends_on:
      postgres:
        condition: service_healthy
